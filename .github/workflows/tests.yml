name: Browser-independent tests

on:
  push:
    branches: ['feature/1.4.0']
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Achievement regressions
        run: node tests/achievements.test.js
      - name: Encyclopedia completion achievements
        run: node tests/catalog_achievements.test.js
      - name: Story and history regressions
        run: node tests/stories.test.js
