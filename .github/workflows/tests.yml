name: Browser-independent tests

on:
  push:
    branches: ['master', 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Progress save regressions
        run: node tests/progress_storage.test.js
      - name: Core data loading
        run: node tests/data_loading.test.js
      - name: Encyclopedia discovery persistence
        run: node tests/encyclopedia_runtime.test.js
      - name: Encyclopedia state refresh
        run: node tests/archive_state_refresh.test.js
      - name: Achievement regressions
        run: node tests/achievements.test.js
      - name: Encyclopedia completion achievements
        run: node tests/catalog_achievements.test.js
      - name: Story and history regressions
        run: node tests/stories.test.js
      - name: Confirmation and notice sound regressions
        run: node tests/confirmation_and_notice.test.js
