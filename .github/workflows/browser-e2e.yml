name: Browser encyclopedia E2E

on:
  push:
    branches: ['feature/encyclopedia-persistence-debug']
  workflow_dispatch:

concurrency:
  # v2 isolates this hardened workflow from the legacy hung run that used the original group.
  group: browser-encyclopedia-e2e-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/the_toho_http.log 2>&1 &
          echo $! > /tmp/the_toho_http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/the_toho_http.log
          exit 1
      - name: Browser acquisition and persistence
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 150s node tests/encyclopedia_browser_e2e.js 2>&1 | tee browser-e2e.log
      - name: Collect server log
        if: always()
        run: cp /tmp/the_toho_http.log browser-e2e-http.log || true
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-browser-e2e
          path: |
            browser-e2e.log
            browser-e2e-http.log
            browser-e2e-stage.txt
            browser-e2e-failure.png
            browser-e2e-after-acquisition.png
            browser-e2e-after-reload.png
          if-no-files-found: warn
