name: Browser encyclopedia E2E

on:
  push:
    branches: ['feature/encyclopedia-persistence-debug']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/the_toho_http.log 2>&1 &
          echo $! > /tmp/the_toho_http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/the_toho_http.log
          exit 1
      - name: Browser acquisition and persistence
        run: node tests/encyclopedia_browser_e2e.js
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-browser-e2e
          path: |
            browser-e2e-after-acquisition.png
            browser-e2e-after-reload.png
          if-no-files-found: ignore
