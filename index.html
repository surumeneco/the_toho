<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="the-toho-version" content="1.4.7" />
  <title>THE 徒歩</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
      height: 100vh;
      height: 100dvh;
    }
    body > canvas {
      display: block;
      width: min(100vw, 56.25vh);
      width: min(100vw, 56.25dvh);
      height: auto;
      max-height: 100%;
    }
  </style>
  <script>
    (async function () {
      const currentVersion = document.querySelector('meta[name="the-toho-version"]').content;
      const base = new URL('./', window.location.href);
      const gamePath = base.pathname;
      const assetVersionKey = 'the_toho:asset-version';
      const scriptFiles = [
        'frameworks/colors_HEX.js',
        'frameworks/colors_String.js',
        'frameworks/phina.js',
        'programs/classes/item.js',
        'programs/classes/dices.js',
        'programs/classes/attack_button.js',
        'programs/classes/player_data.js',
        'programs/classes/enemy.js',
        'programs/loadings.js',
        'programs/global_initializer.js',
        'programs/classes/text_window.js',
        'programs/scenes/loading_scene.js',
        'programs/scenes/title_scene.js',
        'programs/scenes/home_scene.js',
        'programs/scenes/search_scene.js',
        'programs/scenes/battle_scene.js',
        'programs/scenes/win_scene.js',
        'programs/scenes/escape_scene.js',
        'programs/scenes/get_scene.js',
        'programs/scenes/craft_scene.js',
        'programs/scenes/inventory_scene.js',
        'programs/scenes/sleep_scene.js',
        'programs/scenes/gameover_scene.js',
        'programs/scenes/story_scene.js',
        'programs/scenes/refresh_scene.js',
        'programs/progress_storage.js',
        'programs/meta_progress.js',
        'programs/records_v2.js',
        'programs/save_safety.js',
        'programs/scenes/archive_scene.js',
        'programs/archive_controls.js',
        'programs/encyclopedia_storage.js',
        'programs/achievement_definitions.js',
        'programs/achievements.js',
        'programs/encyclopedia_catalog.js',
        'programs/catalog_achievements.js',
        'programs/achievement_ui_integration.js',
        'programs/story_definitions.js',
        'programs/story_system.js',
        'programs/story_resume_guard.js',
        'programs/story_trigger_engine.js',
        'programs/story_ui_extensions.js',
        'programs/confirmation_and_notice.js',
        'programs/archive_scene_v143.js',
        'programs/main.js',
        'programs/story_background_override.js'
      ];

      // HTML自体が古いキャッシュから提供された場合も、最新のバージョンを確認する。
      try {
        const freshIndex = new URL('index.html', base);
        freshIndex.searchParams.set('version_check', Date.now().toString());
        const response = await fetch(freshIndex, { cache: 'no-store' });
        if (response.ok) {
          const html = await response.text();
          const match = html.match(/<meta\s+name="the-toho-version"\s+content="([^"]+)"/);
          if (match && match[1] !== currentVersion) {
            const target = new URL(window.location.href);
            if (target.searchParams.get('v') !== match[1]) {
              target.searchParams.set('v', match[1]);
              window.location.replace(target.href);
              return;
            }
          }
        }
      } catch (error) {
        console.warn('バージョン確認に失敗しました。現在のバージョンで起動します。', error);
      }

      let previousVersion = null;
      try {
        previousVersion = window.localStorage.getItem(assetVersionKey);
      } catch (error) {
        console.warn('保存済みアセットバージョンを読み取れませんでした。', error);
      }
      if (previousVersion !== currentVersion && 'caches' in window) {
        // 同一オリジンの別アプリに影響させず、本ゲームに属するCacheStorageだけを削除する。
        try {
          for (const cacheName of await caches.keys()) {
            const cache = await caches.open(cacheName);
            for (const request of await cache.keys()) {
              const url = new URL(request.url);
              if (url.origin === base.origin && url.pathname.startsWith(gamePath)) {
                await cache.delete(request);
              }
            }
          }
        } catch (error) {
          console.warn('キャッシュの削除に失敗しました。バージョン付きURLから読み込みます。', error);
        }
      }
      try {
        window.localStorage.setItem(assetVersionKey, currentVersion);
      } catch (error) {
        console.warn('アセットバージョンを保存できませんでした。', error);
      }

      for (const file of scriptFiles) {
        const url = new URL(file, base);
        url.searchParams.set('v', currentVersion);
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = url.href;
          script.onload = resolve;
          script.onerror = () => reject(new Error('スクリプトを読み込めません: ' + file));
          document.head.appendChild(script);
        });
      }
    })().catch(error => {
      console.error('THE 徒歩の起動に失敗しました。', error);
    });
  </script>
</head>

<body bgcolor="#3F3F3F">
</body>

</html>
